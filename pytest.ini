# The one pytest configuration. A `[tool.pytest.ini_options]` block in
# pyproject.toml would be silently ignored while this file exists -- pytest
# prints "ignoring pytest config in pyproject.toml" and carries on -- so
# there used to be two, and the settings in the other one (including
# `addopts`) never took effect. Everything belongs here.
[pytest]
testpaths = tests
addopts = -q
markers =
    real_demo_data: call the genuine create_demo_data instead of restoring the session template (see tests/conftest.py)
    heavy: needs the demo database (229'632 readings). Added automatically from the fixtures a test uses -- see tests/conftest.py's pytest_collection_modifyitems. Leave out while developing with -m "not heavy".
