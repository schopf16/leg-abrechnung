name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Ruff (lint / PEP 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests run.py
      - run: ruff format --check app tests run.py

  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      # requirements-dev.txt, not requirements.txt: it includes it and adds
      # pytest-xdist, which is what makes -n auto work.
      - run: pip install -r requirements-dev.txt
      # -n auto splits the suite across the runner's cores. It is passed
      # here rather than put in pytest.ini's addopts on purpose: while
      # working you run a single file, where xdist's process startup costs
      # more than it saves and swallows pdb and print. A full run wants it,
      # a targeted one does not.
      - run: python -m pytest -n auto

  security:
    name: Bandit + pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      # Medium severity and up fails the build; the remaining Low findings
      # (stdlib XML parsing of locally supplied files, random.randint for
      # a customer number, a subprocess call to git for the version string)
      # are reviewed and accepted.
      - run: bandit -q -r app -ll
      - run: pip-audit -r requirements.txt --progress-spinner off
